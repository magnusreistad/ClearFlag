name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs from the Actions tab, e.g. repeated timing runs.
  workflow_dispatch:

jobs:
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-24.04

    services:
      postgres:
        # Postgres 18 (Neon): matches the Neon dev/prod branches (18.6). Keep in
        # step with backend/docker-compose.yml.
        image: postgres:18
        env:
          POSTGRES_USER: clearflag
          POSTGRES_PASSWORD: clearflag
          POSTGRES_DB: clearflag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearflag -d clearflag_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      # The suite runs against the service container above (SCRUM-67). Both
      # point at the same database: alembic/env.py reads DATABASE_URL, and
      # tests/conftest.py reads TEST_DATABASE_URL (and points DATABASE_URL at
      # it itself before the app is imported).
      DATABASE_URL: postgresql+psycopg2://clearflag:clearflag@localhost:5432/clearflag_test
      TEST_DATABASE_URL: postgresql+psycopg2://clearflag:clearflag@localhost:5432/clearflag_test

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Caches pip's download cache, not the installed environment. The
          # glob keys it on requirements-dev.txt too; the default key only
          # hashes requirements.txt.
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      # Exercises the migrations through the real CLI against the fresh service
      # database, as a step of its own so a broken migration fails here by name
      # rather than inside a test fixture. (tests/conftest.py then rebuilds the
      # schema from scratch the same way for the suite itself.)
      - name: Apply migrations to a fresh database
        run: alembic upgrade head

      - name: Run tests
        run: pytest

  # Runs alongside the backend job (no `needs:`), so CI wall time is the
  # slower of the two.
  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Node 24 LTS satisfies Vite 8 (^20.19 || >=22.12). SCRUM-73's .nvmrc
      # will replace this with node-version-file.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Explicit: setup-node only auto-caches when package.json has a
          # packageManager field, and the lockfile isn't at the repo root.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with oxlint
        run: npm run lint

      - name: Run tests
        run: npx vitest run

      # tsc -b then vite build: the only step that typechecks, since Vitest
      # strips types without checking them.
      - name: Typecheck and build
        run: npm run build
