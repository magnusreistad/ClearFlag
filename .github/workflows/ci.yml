name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        env:
          # Placeholder only — importing app.database requires DATABASE_URL to be
          # set, but SQLAlchemy's create_engine() is lazy and never connects here.
          # Tests override the get_db dependency with an in-memory SQLite session,
          # so this value is never actually used to reach a database.
          DATABASE_URL: postgresql://ci:ci@localhost/ci_placeholder
        run: |
          if [ -d tests ]; then pytest; else echo "No tests directory yet — skipping."; fi

  # Frontend job placeholder — uncomment and fill in once the React app
  # is scaffolded in Sprint 3. Keeping this commented out avoids a
  # failing/red CI badge for a frontend that doesn't exist yet.
