# Local Postgres for the backend test suite (SCRUM-67) -- see README.md,
# "Running backend tests". `docker compose up -d --wait` from backend/.
services:
  test-db:
    # Postgres 18 (Neon): matches the Neon dev/prod branches (18.6). Keep in
    # step with the service image in .github/workflows/ci.yml.
    image: postgres:18
    environment:
      POSTGRES_USER: clearflag
      POSTGRES_PASSWORD: clearflag
      POSTGRES_DB: clearflag_test
    ports:
      # 5433, not 5432, so it can't collide with a Postgres already running locally.
      - "5433:5432"
    volumes:
      # Mounted at /var/lib/postgresql, NOT /var/lib/postgresql/data: from
      # postgres:18 the image keeps PGDATA in a versioned subdirectory
      # (/var/lib/postgresql/18/docker), and refuses to start with a volume at
      # the old /data path.
      - test-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearflag -d clearflag_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  test-db-data:
